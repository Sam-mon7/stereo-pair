[package]
name = "stereo-pair"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
ctrlc = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "accesskit"] }
hex = "0.4"
hkdf = "0.12"
mdns-sd = "0.22.0"
num-bigint = "0.4"
num-traits = "0.2"
plist = "1"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.54", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_Media", "Win32_Foundation", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
debug = 1
